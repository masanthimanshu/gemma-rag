services:
  app:
    build: .
    ports:
      - "3500:3500"
    restart: always
    env_file:
      - .env
    volumes:
      - models:/app/models

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy-manager
    restart: always
    ports:
      - "81:81"      # NPM Admin Web UI
      - "80:80"      # Public HTTP Traffic
      - "443:443"    # Public HTTPS Traffic
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  models:
  npm_data:
  npm_letsencrypt:
